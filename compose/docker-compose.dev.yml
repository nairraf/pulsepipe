services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - pulsepipe_net

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:3000"
    networks:
      - pulsepipe_net

  fastapi:
    build:
      context: ../src
      dockerfile: ../docker/fastapi/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app
    env_file:
      - .env.dev
    networks:
      - pulsepipe_net
    depends_on:
      - qdrant

volumes:
  qdrant_data:

networks:
  pulsepipe_net:
    driver: bridge
